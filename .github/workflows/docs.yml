name: Deploy Documentation

# The arcagent repo is PRIVATE, and the free GitHub plan cannot host GitHub
# Pages for private repos (enabling Pages returns HTTP 422). So the mdBook
# docs are built here and handed off to the PUBLIC repo
# MKonovalov/arcpedia-journal, which serves GitHub Pages from its `gh-pages`
# branch (alongside arc-evolve, journal, etc.).
#
# SINGLE-OWNER RULE (gh-pages is contested by two publishers otherwise):
#   - arcagent is the SOLE writer of the staging branch `arcagent-docs`.
#   - arcpedia-journal's deploy script is the SOLE writer of `gh-pages` and
#     INGESTS `arcagent-docs/docs/arcagent` into its build before pushing.
# arcagent therefore NEVER pushes gh-pages directly — that avoids the race
# with the journal deploy that previously clobbered these docs.
#
# The write token is the shared arcpedia GitHub PAT resolved from Bitwarden
# Secrets Manager, exactly as ci.yml does for the gasp checkout (convention:
# ARCPEDIA_GITHUB_TOKEN, BWS UUID e6c364e3-1f29-4904-bf14-b486013a7f9d).
# It must have Contents: Read+Write on MKonovalov/arcpedia-journal.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs"
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve arcpedia publish token from BWS
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu   # account is vault.bitwarden.eu; default (us) -> invalid_client
          secrets: |
            e6c364e3-1f29-4904-bf14-b486013a7f9d > ARCPEDIA_GITHUB_TOKEN

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.43/mdbook-v0.4.43-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build

      # Publish to the arcagent-OWNED staging branch. arcagent is the only
      # writer here, so there is no race. arcpedia-journal's deploy script is
      # responsible for copying docs/arcagent from this branch into gh-pages.
      - name: Publish to arcpedia-journal staging branch (arcagent-docs)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ env.ARCPEDIA_GITHUB_TOKEN }}
          external_repository: MKonovalov/arcpedia-journal
          publish_branch: arcagent-docs
          publish_dir: ./book
          destination_dir: docs/arcagent
          user_name: arcagent-ci
          user_email: mike.kon@gmail.com
          commit_message: "docs(arcagent): publish mdBook from arcagent@${{ github.sha }}"
