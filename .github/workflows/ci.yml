name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Build
        run: cargo build --all-features

  # Built-in tools shell out to unix commands, so Windows only checks compilation.
  windows-check:
    name: Check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets --all-features

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-features

  # arcagent claims to be a tested GASP-conformant runtime — this job is the
  # test: emit an agent repo with the gasp bridge (mock provider, no network)
  # and run the protocol's conformance checker against it.
  gasp-conformance:
    name: GASP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # MKonovalov/gasp is a PRIVATE repo; the default GITHUB_TOKEN can't see
      # it (404 "Repository not found"). Pull a PAT with repo access from BWS
      # and use it for the gasp checkout below. Convention: ARCPEDIA_GITHUB_TOKEN
      # (UUID e6c364e3-1f29-4904-bf14-b486013a7f9d) is the shared github access
      # token; sm-action resolves it into the GASP_GITHUB_TOKEN env var.
      - name: Resolve gasp checkout token from BWS
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu   # account is vault.bitwarden.eu; default (us) -> invalid_client
          secrets: |
            e6c364e3-1f29-4904-bf14-b486013a7f9d > GASP_GITHUB_TOKEN
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Emit agent repo via the gasp bridge
        run: |
          git config --global user.email "mike.kon@gmail.com"
          git config --global user.name "arcagent-ci"
          cargo run --example gasp_emit --features gasp -- /tmp/emitted-repo
      - name: Checkout gasp (conformance checker)
        uses: actions/checkout@v4
        with:
          repository: MKonovalov/gasp
          ref: 08a60a2ee30d6bc065ffbadec34a7993dc109fdf # pin: checker changes must not break arcagent CI silently
          path: gasp-checker
          token: ${{ env.GASP_GITHUB_TOKEN }}
      - name: Run conformance checker against a fresh clone (true restore)
        run: |
          # GASP restore IS `git clone` — checking the emitting worktree would
          # pass on untracked scaffolding that a clone doesn't have.
          git clone -q /tmp/emitted-repo /tmp/restored-repo
          cd gasp-checker/conformance-check
          cargo run -q -- /tmp/restored-repo
