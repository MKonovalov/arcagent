[book]
authors = ["ArcLumen Team"]
language = "en"
src = "docs"
title = "arcagent Documentation"
description = "Documentation for arcagent - simple, effective agent loop in Rust"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/MKonovalov/arcagent"
edit-url-template = "https://github.com/MKonovalov/arcagent/edit/main/{path}"
# Hosted under the public arcpedia-journal Pages site (private repo can't use
# GitHub Pages on the free plan). Must match docs.yml destination_dir.
site-url = "/arcpedia-journal/docs/arcagent/"
additional-css = ["docs/theme/custom.css"]

[output.html.search]
enable = true
limit-results = 20
