[book]
authors = ["ArcLumen Team"]
language = "en"
src = "docs"
title = "arcgent Documentation"
description = "Documentation for arcgent - simple, effective agent loop in Rust"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/MKonovalov/arcgent"
edit-url-template = "https://github.com/MKonovalov/arcgent/edit/main/{path}"
site-url = "/arcgent/"
additional-css = ["docs/theme/custom.css"]

[output.html.search]
enable = true
limit-results = 20
